name: Publish OCI Package

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake gcc-arm-none-eabi libnewlib-arm-none-eabi git make python3

      - name: Build PicoCalc UF2
        run: |
          make picocalc

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mellivora-picocalc-uf2
          path: picocalc/build/mellivora_picocalc.uf2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Read project metadata
        id: project
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "repository=$(cat REPOSITORY)" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches project version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match VERSION $VERSION" >&2
            exit 1
          fi

      - name: Build and push OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.project.outputs.version }}
            REPOSITORY=${{ steps.project.outputs.repository }}
