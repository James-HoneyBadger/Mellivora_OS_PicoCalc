<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="title desc">
  <title id="title">Mellivora PicoCalc quick start</title>
  <desc id="desc">Four steps: hold BOOTSEL and connect USB, copy the matching UF2, copy the starter pack to a FAT32 card, then mount and open the launcher.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cc8c0"/>
      <stop offset="1" stop-color="#e8c15a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172127"/>
      <stop offset="1" stop-color="#121a1f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .label { fill: #d9e2e8; font-size: 15px; font-weight: 600; }
      .sub { fill: #7a8b96; font-size: 12px; }
      .num { fill: #0b0f12; font-size: 15px; font-weight: 700; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5cc8c0; font-size: 11.5px; }
    </style>
  </defs>

  <rect width="880" height="250" rx="16" fill="#0b0f12"/>
  <rect x="1" y="1" width="878" height="248" rx="15.5" fill="none" stroke="#243038"/>

  <text x="26" y="34" class="t" fill="#d9e2e8" font-size="16" font-weight="700">Mellivora PicoCalc — quick start</text>
  <text x="26" y="54" class="t sub">Four steps, about three minutes.</text>

  <!-- connectors -->
  <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M212 140 h26" marker-end="url(#a)"/>
    <path d="M427 140 h26"/>
    <path d="M642 140 h26"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5cc8c0"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <g>
    <rect x="26" y="82" width="186" height="132" rx="12" fill="url(#card)" stroke="#243038"/>
    <circle cx="50" cy="106" r="12" fill="url(#accent)"/>
    <text x="50" y="111" text-anchor="middle" class="t num">1</text>
    <text x="72" y="111" class="t label">BOOTSEL</text>
    <text x="42" y="134" class="t sub">Hold BOOTSEL,</text>
    <text x="42" y="150" class="t sub">then plug in USB.</text>
    <rect x="42" y="166" width="154" height="30" rx="6" fill="#0a1014" stroke="#1d2a31"/>
    <text x="54" y="186" class="mono">RPI-RP2 drive</text>
  </g>

  <!-- step 2 -->
  <g>
    <rect x="241" y="82" width="186" height="132" rx="12" fill="url(#card)" stroke="#243038"/>
    <circle cx="265" cy="106" r="12" fill="url(#accent)"/>
    <text x="265" y="111" text-anchor="middle" class="t num">2</text>
    <text x="287" y="111" class="t label">Copy the UF2</text>
    <text x="257" y="134" class="t sub">Match the board:</text>
    <text x="257" y="150" class="t sub">pico, pico2, pico2w.</text>
    <rect x="257" y="166" width="154" height="30" rx="6" fill="#0a1014" stroke="#1d2a31"/>
    <text x="269" y="186" class="mono">mellivora_*.uf2</text>
  </g>

  <!-- step 3 -->
  <g>
    <rect x="456" y="82" width="186" height="132" rx="12" fill="url(#card)" stroke="#243038"/>
    <circle cx="480" cy="106" r="12" fill="url(#accent)"/>
    <text x="480" y="111" text-anchor="middle" class="t num">3</text>
    <text x="502" y="111" class="t label">SD card</text>
    <text x="472" y="134" class="t sub">FAT32 card plus</text>
    <text x="472" y="150" class="t sub">the starter pack.</text>
    <rect x="472" y="166" width="154" height="30" rx="6" fill="#0a1014" stroke="#1d2a31"/>
    <text x="484" y="186" class="mono">/apps /themes /bin</text>
  </g>

  <!-- step 4 -->
  <g>
    <rect x="671" y="82" width="183" height="132" rx="12" fill="url(#card)" stroke="#243038"/>
    <circle cx="695" cy="106" r="12" fill="url(#accent)"/>
    <text x="695" y="111" text-anchor="middle" class="t num">4</text>
    <text x="717" y="111" class="t label">Boot</text>
    <text x="687" y="134" class="t sub">mount, then home</text>
    <text x="687" y="150" class="t sub">for the launcher.</text>
    <rect x="687" y="166" width="151" height="30" rx="6" fill="#0a1014" stroke="#1d2a31"/>
    <text x="699" y="186" class="mono">mount; home</text>
  </g>

  <text x="26" y="236" class="t sub">Prefer a guided flow? Use the browser installer at docs/flasher/index.html.</text>
</svg>
